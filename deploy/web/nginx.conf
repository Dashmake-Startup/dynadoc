server {
    listen 80;
    server_name localhost;

    set $dynadoc_api_base ${DYNADOC_API_BASE};
    proxy_ssl_server_name on;

    location /api/ {
        proxy_pass $dynadoc_api_base;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass $dynadoc_api_base;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /share/ {
        proxy_pass $dynadoc_api_base;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /license/ {
        proxy_pass $dynadoc_api_base;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /integrations/ {
        proxy_pass $dynadoc_api_base;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /billing/ {
        proxy_pass $dynadoc_api_base;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass $dynadoc_api_base;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build assets carry a content hash in their filename (Vite emits them under
    # /assets/), so a cached copy can never be stale: a new build produces new
    # names. Cache them immutably.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Typefaces, which need one header the images below do not.
    #
    # The sign-in pages are served by Casdoor on auth.dynadoc.dashmake.com and
    # pull the brand faces from /fonts/brand/ on this origin. That is a
    # different origin, and a font is always fetched in CORS mode even when an
    # image from the same host is not: without Access-Control-Allow-Origin the
    # browser downloads the file and then refuses to use it. With
    # font-display: swap on the Casdoor side the page still paints, in the
    # fallback stack, so the failure is invisible, which is why this header
    # is the thing that actually makes the branded sign-in page work.
    #
    # The value is * because these are public static files carrying no
    # credentials, and because the auth host is not the only origin that may
    # need them (app.ch, app.us, app.ap).
    #
    # This block must stay ABOVE the media block: nginx tries regex locations
    # in file order and the first match wins. add_header is not inherited into
    # a block that sets its own, so the Cache-Control line is repeated here
    # rather than borrowed from below.
    location ~* \.(woff2?|ttf|otf|eot)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        add_header Access-Control-Allow-Origin "*";
    }

    # Other static media (favicon, images). Cacheable, but not immutable:
    # these keep their names across builds.
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000, no-transform";
    }

    # The SPA shell. index.html must never be cached: it names the hashed JS/CSS
    # bundles, and those names change on every deploy. A browser holding a cached
    # index.html then imports chunks that no longer exist, the app boots half-way,
    # and on 2026-10-21 one such half-booted session saved an empty document over
    # a real one in the drive. Revalidating the shell makes a deploy visible
    # immediately instead.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
